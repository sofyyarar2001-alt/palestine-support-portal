name: Deploy React/Vite to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate TanStack routes
        run: bunx tsr generate

      - name: Build
        run: bun run build

      - name: Prepare Pages
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist

          if [ -d ".output/public" ]; then
            cp -R .output/public/. pages-dist/
          elif [ -d "dist/client" ]; then
            cp -R dist/client/. pages-dist/
          elif [ -d "dist" ]; then
            cp -R dist/. pages-dist/
          else
            echo "ERROR: No build output directory found"
            find . -maxdepth 4 -type d -print
            exit 1
          fi

          echo "=== PAGES DIST ==="
          find pages-dist -maxdepth 6 -type f -print

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
