name: Deploy React/Vite to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Find build output
        run: |
          echo "=== BUILD OUTPUT ==="
          find . -maxdepth 5 -type d \
            \( -name "dist" -o -name ".output" -o -name "build" \) \
            -print

          echo "=== ROOT FILES ==="
          ls -la

          echo "=== OUTPUT CONTENT ==="
          if [ -d ".output" ]; then
            find .output -maxdepth 4 -type f -print
          fi

          if [ -d "dist" ]; then
            find dist -maxdepth 4 -type f -print
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          rm -rf pages-dist
          mkdir -p pages-dist

          if [ -d "dist" ] && [ "$(find dist -type f | wc -l)" -gt 0 ]; then
            cp -R dist/. pages-dist/
          elif [ -d ".output/public" ] && [ "$(find .output/public -type f | wc -l)" -gt 0 ]; then
            cp -R .output/public/. pages-dist/
          else
            echo "ERROR: No static build output found."
            echo "Available directories:"
            find . -maxdepth 5 -type d -print
            exit 1
          fi

          echo "=== PAGES ARTIFACT ==="
          find pages-dist -maxdepth 4 -type f -print

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
